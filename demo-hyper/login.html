<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria HyperBook</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>

    <section class="hero is-fullheight has-background-light">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-centered">

                    <div class="column is-4-desktop is-6-tablet">
                       <div class="box p-6 shadow-lg">

                        <div class="has-text-centered mb-5">
                            <h1 class="title is-2 has-text-dark mb-1">
                                Hyper<span class="has-text-warning">Book</span>
                            </h1>
                            <p class="subtitle is-6 has-text-grey">Sua livraria online</p>
                        </div>

                        <form action="index.html">
                            <div class="field">
                                <label class="label" for="user">Usuário</label>

                                <div class="control">
                                    <input class="input" type="text" id="user" name="user" placeholder="Digite seu usuário" required>
                                </div>
                            </div>

                            <div class="field mb-5">
                                <label class="label" for="pass">Senha</label>
                                <div class="control">
                                    <input class="input" type="password" name="pass" id="pass" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="field">
                                <div class="buttons">
                                    <button type="submit" class="button is-link is-fullwidth has-text-weight-bold">Entrar</button>
                                </div>
                            </div>
                        </form>

                        <div class="is-flex is-justify-content-space-between mt-4 is-size-7">
                            <a href="cadastro.html" class="has-text-link">
                                Cadastre-se
                            </a>
                            <a href="#" class="has-text-grey">
                                Esqueceu a senha?
                            </a>
                        </div>

                       </div> 
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
